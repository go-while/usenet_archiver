name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Read only, except for the job that publishes the release.
permissions:
  contents: read

# "shell: bash" runs every step as bash -eo pipefail (the default is bash -e,
# under which a failing command piped into head went unnoticed).
defaults:
  run:
    shell: bash

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  zipapp:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python3 -c 'from usenet_archiver import __version__; print(__version__)')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match __version__ ${version}" >&2
            exit 1
          fi

      - name: Build zipapp + tarball
        run: |
          chmod +x scripts/build_zipapp.sh bin/usenet-archiver
          ./scripts/build_zipapp.sh
          ./dist/usenet-archiver -c --help > help.txt
          head -n 5 help.txt
          grep -q "list-groups" help.txt

      - name: Upload zipapp tarball
        uses: actions/upload-artifact@v4
        with:
          name: zipapp-tarball
          path: dist/usenet-archiver-*-zipapp.tar.gz

  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # On AlmaLinux 9 (glibc 2.34), so that it runs there, on Rocky and
      # CentOS Stream 9, and on everything newer.
      - name: Build the AppImage in an AlmaLinux 9 container
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./scripts/build_appimage_in_container.sh
          # Smoke-test CLI path inside AppImage (no display needed)
          ./dist/Usenet_Archiver-*-x86_64.AppImage -c --help > help.txt
          head -n 5 help.txt
          grep -q "list-groups" help.txt

      - uses: actions/setup-go@v5
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum

      # Run it over TLS on other distributions (a local test server, no
      # real one).
      - name: TLS from the AppImage on Fedora, Arch, openSUSE, Debian, AlmaLinux 9 and Ubuntu 22.04
        run: ./scripts/check_appimage_tls.sh dist/Usenet_Archiver-*-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/Usenet_Archiver-*.AppImage

  release:
    needs: [tests, zipapp, appimage]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.AppImage' -o -name '*-zipapp.tar.gz' \) -exec cp -v {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
