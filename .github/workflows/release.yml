name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Read only, except for the job that publishes the release.
permissions:
  contents: read

# "shell: bash" runs every step as bash -eo pipefail (the default is bash -e,
# under which a failing command piped into head went unnoticed).
defaults:
  run:
    shell: bash

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  zipapp:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python3 -c 'from usenet_archiver import __version__; print(__version__)')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match __version__ ${version}" >&2
            exit 1
          fi

      - name: Build zipapp + tarball
        run: |
          chmod +x scripts/build_zipapp.sh bin/usenet-archiver
          ./scripts/build_zipapp.sh
          ./dist/usenet-archiver -c --help > help.txt
          head -n 5 help.txt
          grep -q "list-groups" help.txt

      - name: Upload zipapp tarball
        uses: actions/upload-artifact@v4
        with:
          name: zipapp-tarball
          path: dist/usenet-archiver-*-zipapp.tar.gz

  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk libfuse2 wget file

      - name: Build zipapp + AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x scripts/build_zipapp.sh scripts/build_appimage.sh bin/usenet-archiver
          ./scripts/build_appimage.sh
          # Smoke-test CLI path inside AppImage (no display needed)
          ./dist/Usenet_Archiver-*-x86_64.AppImage -c --help > help.txt
          head -n 5 help.txt
          grep -q "list-groups" help.txt

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/Usenet_Archiver-*.AppImage

  release:
    needs: [tests, zipapp, appimage]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.AppImage' -o -name '*-zipapp.tar.gz' \) -exec cp -v {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
