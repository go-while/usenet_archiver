[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "usenet-archiver"
version = "2.0.1+gw1"  # PEP 440 spelling of 2.0.1-gw1 (see usenet_archiver/__init__.py)
description = "Fetch text Usenet groups over NNTP into mbox archives"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-2-Clause" }
authors = [{ name = "Jason Evans" }]
dependencies = []

[project.scripts]
usenet-archiver = "usenet_archiver.app:run"

[tool.setuptools.packages.find]
include = ["usenet_archiver*"]
